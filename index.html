<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Scanner</title>
<meta name="description" content="Scanner de QR codes et codes-barres, installable, sans dépendance serveur.">
<meta name="theme-color" content="#0E1210">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg: #0E1210;
    --panel: #171A17;
    --panel-2: #1F231F;
    --text: #F0EFE9;
    --text-dim: #9AA39A;
    --red: #FF4438;
    --green: #34D399;
    --border: #2A2F2A;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  .mono{ font-family:'Space Mono', monospace; }

  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---------- Top bar ---------- */
  header{
    position:absolute; top:0; left:0; right:0; z-index:20;
    padding: calc(14px + var(--safe-top)) 18px 14px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .mark{ color:var(--red); font-size:22px; line-height:1; }
  .brand .name{ font-weight:800; font-size:16px; letter-spacing:.2px; }
  .iconbtn{
    width:40px; height:40px; border-radius:12px; border:1px solid rgba(255,255,255,.14);
    background:rgba(20,22,20,.5); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; color:var(--text);
    cursor:pointer;
  }
  .iconbtn.active{ border-color:var(--red); color:var(--red); }
  .topRight{ display:flex; gap:8px; }

  /* ---------- Camera viewfinder ---------- */
  #camWrap{ position:relative; flex:1; overflow:hidden; background:#000; }
  #video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #overlay{ position:absolute; inset:0; pointer-events:none; }

  .frame{
    position:absolute; left:50%; top:45%; transform:translate(-50%,-50%);
    width:min(76vw, 340px); height:min(76vw, 340px);
  }
  .corner{ position:absolute; width:34px; height:34px; border-color:var(--red); }
  .corner.tl{ top:0; left:0; border-top:4px solid; border-left:4px solid; border-top-left-radius:10px; }
  .corner.tr{ top:0; right:0; border-top:4px solid; border-right:4px solid; border-top-right-radius:10px; }
  .corner.bl{ bottom:0; left:0; border-bottom:4px solid; border-left:4px solid; border-bottom-left-radius:10px; }
  .corner.br{ bottom:0; right:0; border-bottom:4px solid; border-right:4px solid; border-bottom-right-radius:10px; }

  .laser{
    position:absolute; left:6%; right:6%; height:2px;
    background:linear-gradient(90deg, transparent, var(--red) 20%, var(--red) 80%, transparent);
    box-shadow:0 0 8px 1px var(--red);
    animation: sweep 2.1s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{ top:6%; opacity:.9; }
    50%{ top:94%; opacity:.9; }
    51%{ opacity:0; }
    52%{ top:6%; opacity:0; }
    53%{ opacity:.9; }
    100%{ top:94%; opacity:.9; }
  }
  .frame.hit .corner{ border-color:var(--green); transition:border-color .15s; }
  .frame.hit .laser{ display:none; }

  .hint{
    position:absolute; left:50%; bottom:calc(23vh); transform:translateX(-50%);
    color:var(--text-dim); font-size:13px; text-align:center; width:80vw;
  }

  #noCam{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:40px; text-align:center; color:var(--text-dim);
  }
  #noCam button{
    background:var(--red); color:#12100F; border:none; border-radius:12px; padding:12px 20px;
    font-weight:800; font-size:14px; cursor:pointer;
  }

  /* ---------- Bottom sheet ---------- */
  #sheet{
    position:relative; z-index:15;
    background:var(--panel);
    border-top:1px solid var(--border);
    border-radius:20px 20px 0 0;
    margin-top:-20px;
    padding: 10px 0 calc(10px + var(--safe-bottom));
    display:flex; flex-direction:column;
    max-height:46vh;
  }
  .grip{ width:36px; height:4px; background:var(--border); border-radius:99px; margin:2px auto 10px; }

  .tabs{ display:flex; gap:6px; padding:0 16px 10px; }
  .tab{
    flex:1; text-align:center; padding:9px 10px; border-radius:10px;
    font-size:13px; font-weight:700; color:var(--text-dim); cursor:pointer;
    border:1px solid transparent;
  }
  .tab.on{ color:var(--text); background:var(--panel-2); border-color:var(--border); }

  .paneWrap{ flex:1; overflow-y:auto; padding:0 16px 16px; }

  /* History */
  .empty{ color:var(--text-dim); font-size:13px; padding:18px 4px; text-align:center; }
  .hrow{
    display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);
  }
  .hrow:last-child{ border-bottom:none; }
  .htype{
    flex-shrink:0; width:30px; height:30px; border-radius:8px; background:var(--panel-2);
    display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .hbody{ flex:1; min-width:0; }
  .htext{ font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hmeta{ font-size:11px; color:var(--text-dim); margin-top:2px; }
  .hact{ display:flex; gap:6px; flex-shrink:0; }
  .hact button{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; width:30px; height:30px; font-size:13px; cursor:pointer;
  }
  .clearRow{ display:flex; justify-content:flex-end; padding:6px 0 2px; }
  .clearRow button{ background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer; text-decoration:underline; }

  /* Generate */
  .genForm textarea{
    width:100%; min-height:64px; resize:vertical; background:var(--panel-2);
    border:1px solid var(--border); border-radius:10px; color:var(--text);
    font-family:inherit; font-size:14px; padding:10px 12px; margin-top:8px;
  }
  .genForm label{ font-size:12px; color:var(--text-dim); }
  .genBtn{
    margin-top:10px; width:100%; background:var(--red); color:#12100F; border:none;
    border-radius:10px; padding:11px; font-weight:800; font-size:14px; cursor:pointer;
  }
  .genOut{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:14px; }
  .genOut canvas{ border-radius:12px; background:#fff; padding:10px; }
  .genOut a{
    color:var(--text); background:var(--panel-2); border:1px solid var(--border);
    text-decoration:none; font-size:13px; padding:8px 16px; border-radius:10px;
  }

  /* Result toast */
  #toast{
    position:fixed; left:50%; bottom:calc(48vh); transform:translate(-50%,10px);
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:10px 16px; border-radius:12px; font-size:13px; z-index:40;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  /* Result modal */
  #resultModal{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:flex-end; justify-content:center;
    background:rgba(0,0,0,.55);
  }
  #resultModal.show{ display:flex; }
  .rcard{
    width:100%; max-width:480px; background:var(--panel);
    border-top:1px solid var(--border); border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + var(--safe-bottom));
  }
  .rcard .rtype{ color:var(--red); font-size:12px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; }
  .rcard .rcontent{
    margin:10px 0 16px; font-size:15px; word-break:break-word; line-height:1.5;
    max-height:22vh; overflow-y:auto;
  }
  .ractions{ display:flex; flex-wrap:wrap; gap:8px; }
  .ractions button, .ractions a{
    flex:1; min-width:100px; text-align:center; text-decoration:none;
    background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:11px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .ractions .primary{ background:var(--red); color:#12100F; border-color:var(--red); }
  .rclose{
    display:block; width:100%; text-align:center; margin-top:10px; padding:11px;
    background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer;
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand"><span class="mark">◎</span><span class="name">SCANNER</span></div>
    <div class="topRight">
      <div class="iconbtn" id="torchBtn" title="Flash">⚡</div>
      <div class="iconbtn" id="switchBtn" title="Changer de caméra">⟲</div>
    </div>
  </header>

  <div id="camWrap">
    <video id="video" playsinline muted autoplay></video>
    <div id="overlay">
      <div class="frame" id="frame">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="laser"></div>
      </div>
      <div class="hint">Cadre le QR code ou le code-barres</div>
    </div>
    <div id="noCam">
      <div style="font-size:34px;">🎥</div>
      <div>Accès à la caméra refusé ou indisponible.<br>Autorise la caméra pour scanner.</div>
      <button id="retryCam">Réessayer</button>
    </div>
  </div>

  <div id="sheet">
    <div class="grip"></div>
    <div class="tabs">
      <div class="tab on" data-pane="history">Historique</div>
      <div class="tab" data-pane="generate">Générer</div>
    </div>
    <div class="paneWrap">
      <div id="pane-history">
        <div class="clearRow"><button id="clearHist">tout effacer</button></div>
        <div id="histList"></div>
      </div>
      <div id="pane-generate" style="display:none;">
        <div class="genForm">
          <label>Texte, lien, ou contenu à encoder</label>
          <textarea id="genInput" placeholder="https://exemple.com"></textarea>
          <button class="genBtn" id="genBtn">Générer le QR code</button>
        </div>
        <div class="genOut" id="genOut" style="display:none;">
          <canvas id="genCanvas"></canvas>
          <a id="genDownload" download="qrcode.png">Télécharger l'image</a>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<div id="resultModal">
  <div class="rcard">
    <div class="rtype" id="rType">QR CODE</div>
    <div class="rcontent mono" id="rContent"></div>
    <div class="ractions" id="rActions"></div>
    <button class="rclose" id="rClose">Fermer et continuer à scanner</button>
  </div>
</div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
